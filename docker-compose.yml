services:
  # FastAPI inference service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nidstream-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - nidstream-network

  # Streamlit dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: nidstream-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - nidstream-network

  # MLflow tracking server
  # Backend store is controlled by MLFLOW_BACKEND_STORE (set in .env):
  #   Local:  file:///mlruns   (default)
  #   AWS:    s3://nidstream/mlflow  (set by scripts/start.sh --aws)
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: nidstream-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ${HOME}/.aws:/root/.aws:ro
    environment:
      - PYTHONUNBUFFERED=1
      - AWS_PROFILE=${AWS_PROFILE:-nidstream}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-1}
    command: >
      --backend-store-uri ${MLFLOW_BACKEND_STORE:-file:///mlruns}
      --default-artifact-root ${MLFLOW_ARTIFACT_ROOT:-/mlruns/artifacts}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nidstream-network

networks:
  nidstream-network:
    driver: bridge
